# Прод-раскладка. Два сценария, выбирается профилем.
#
# 1. На сервере уже есть nginx или другой веб-сервер (частый случай, если код
#    лежит в /var/www). Тогда порты 80 и 443 заняты им, и воевать за них не
#    надо: поднимаем только приложение на localhost, а проксирует его nginx.
#
#      docker compose up -d
#
#    Конфиг для nginx лежит рядом: deploy/nginx.conf
#
# 2. Сервер чистый, 80 и 443 свободны. Тогда Caddy сам получит и продлит TLS.
#
#      docker compose --profile caddy up -d
#
# HTTPS обязателен в обоих случаях: браузер не даёт доступ к микрофону на любом
# хосте кроме localhost без защищённого соединения, то есть без сертификата
# главная функция сервиса не работает.
#
# Публичный порт при этом обязан остаться 443. Адрес вида
# https://chtostuchit.ru:8443 никто не набирает, ссылки в мессенджерах на нём
# ломаются. Менять можно только внутренние порты — их и вынесли в .env.
#
#   cp service/.env.example .env   # заполнить AIMLAPI_KEY
#   docker compose up -d

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CORPUS_DIR: /data/corpus
    volumes:
      # Корпус переживает пересборку образа: это собранные данные, а не кэш.
      - corpus:/data/corpus
    ports:
      # Только на localhost. Наружу приложение смотреть не должно ни в одном из
      # сценариев: снаружи с ним говорит nginx или Caddy, а не интернет.
      - "127.0.0.1:${APP_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  corpus:
  caddy_data:
  caddy_config:
