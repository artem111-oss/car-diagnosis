# Редирект на канонический домен. Подключать ТОЛЬКО после того, как certbot
# выпустил сертификаты: блок объявляет `listen 443 ssl` и без них nginx не
# стартует.
#
#   sudo cp deploy/nginx-canonical.conf /etc/nginx/sites-available/chtostuchit-canonical
#   sudo ln -sf /etc/nginx/sites-available/chtostuchit-canonical /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Затем уберите три неканонических имени из server_name основного конфига,
# иначе nginx не поймёт, какой блок отвечает, и возьмёт первый подошедший.
#
# Зачем это нужно: chtostuchit.ru выбран каноническим, потому что punycode
# ломается при копировании в мессенджеры и почту, а латиница работает везде.
# Кириллический домен остаётся живым и приводит людей, но поиск видит один
# сайт, а не две копии.
#
# http2 указан в старом синтаксисе `listen ... http2`, а не отдельной строкой
# `http2 on`: последняя появилась только в nginx 1.25.1 и на более старых
# сборках роняет конфиг с «unknown directive».

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.chtostuchit.ru
                xn--h1aljccbf1af.xn--p1ai www.xn--h1aljccbf1af.xn--p1ai;

    # Пути к сертификатам подставьте те, что выдал certbot: он кладёт их в
    # /etc/letsencrypt/live/<первый домен из списка -d>/
    ssl_certificate     /etc/letsencrypt/live/chtostuchit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chtostuchit.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://chtostuchit.ru$request_uri;
}
