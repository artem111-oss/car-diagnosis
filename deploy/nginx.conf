# Конфиг для сервера, где nginx уже стоит и держит 80 и 443.
#
# Здесь только HTTP и намеренно. Блоки TLS дописывает certbot: если объявить
# `listen 443 ssl` заранее, nginx откажется стартовать с «no ssl_certificate is
# defined» — сертификатов ещё нет, а получить их можно только через живой
# nginx. Пытаться описать 443 руками до выпуска значит ловить эту петлю.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/chtostuchit
#   sudo ln -sf /etc/nginx/sites-available/chtostuchit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
#   sudo certbot --nginx -d chtostuchit.ru -d www.chtostuchit.ru \
#                        -d xn--h1aljccbf1af.xn--p1ai -d www.xn--h1aljccbf1af.xn--p1ai
#
# Certbot сам добавит `listen 443 ssl`, сертификаты и редирект с HTTP, сохранив
# location и таймауты ниже. Кириллический домен указывается только в punycode:
# чтостучит.рф это xn--h1aljccbf1af.xn--p1ai, кириллицу certbot не понимает.
#
# Редирект на канонический домен включается ПОСЛЕ выпуска сертификатов —
# см. deploy/nginx-canonical.conf.

server {
    listen 80;
    listen [::]:80;

    server_name chtostuchit.ru www.chtostuchit.ru
                xn--h1aljccbf1af.xn--p1ai www.xn--h1aljccbf1af.xn--p1ai;

    # Загрузка аудио: запас над MAX_UPLOAD_MB приложения (25 МБ). Без этого
    # nginx обрежет запись раньше, чем сервис объяснит причину.
    client_max_body_size 30M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Микрофон нужен нам, остальное запрещаем.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location / {
        # Должно совпадать с APP_PORT из .env. Проверить, на чём слушает
        # контейнер:  sudo ss -tlnp | grep docker
        proxy_pass http://127.0.0.1:8091;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Анализ занимает секунды, разбор механиком доходит до минуты.
        # Дефолтных 60 секунд не хватает, и пользователь ловил бы 504 на самом
        # ценном шаге, уже увидев вердикт.
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout 10s;

        # Ответ отдаём целиком, без буферизации.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
