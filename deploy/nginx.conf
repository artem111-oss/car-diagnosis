# Конфиг для сервера, где nginx уже стоит и держит 80 и 443.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/chtostuchit
#   sudo ln -sf /etc/nginx/sites-available/chtostuchit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификаты выпускает certbot, он же дописывает сюда ssl-строки:
#
#   sudo certbot --nginx -d chtostuchit.ru -d www.chtostuchit.ru \
#                        -d xn--h1aljccbf1af.xn--p1ai -d www.xn--h1aljccbf1af.xn--p1ai
#
# Кириллический домен указывается только в punycode: чтостучит.рф это
# xn--h1aljccbf1af.xn--p1ai. Certbot и nginx кириллицу не понимают.

# --- Кириллический домен и www: постоянный редирект на канонический ---------
# Причина не во вкусе: punycode ломается при копировании в мессенджеры и почту,
# латиница работает везде. Кириллический домен остаётся живым и приводит людей,
# но поиск видит один сайт, а не два одинаковых.
server {
    listen 80;
    listen [::]:80;
    server_name www.chtostuchit.ru xn--h1aljccbf1af.xn--p1ai www.xn--h1aljccbf1af.xn--p1ai;
    return 301 https://chtostuchit.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name chtostuchit.ru;
    return 301 https://chtostuchit.ru$request_uri;
}

# --- Канонический домен -----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chtostuchit.ru;

    # Строки ssl_certificate добавит certbot при первом выпуске.

    # Загрузка аудио: держим запас над MAX_UPLOAD_MB приложения (25 МБ).
    client_max_body_size 30M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Микрофон нужен нам, остальное запрещаем.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location / {
        # Порт должен совпадать с APP_PORT из .env (по умолчанию 8090).
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Анализ занимает секунды, разбор механиком доходит до минуты. Дефолтных
        # 60 секунд не хватает, и пользователь получал бы 504 на самом ценном
        # шаге.
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout 10s;

        # Ответ отдаём целиком, без буферизации: длинные запросы иначе висят.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# --- Редирект кириллического домена на HTTPS --------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.chtostuchit.ru xn--h1aljccbf1af.xn--p1ai www.xn--h1aljccbf1af.xn--p1ai;

    # Строки ssl_certificate добавит certbot.

    return 301 https://chtostuchit.ru$request_uri;
}
